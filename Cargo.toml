[package]
name = "cargo-plugin-utils"
description = "Shared utilities for cargo plugins (logger, subprocess handling, common functions)"
version = "0.0.23"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "plugin", "utilities", "logger", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/cargo-plugin-utils"
documentation = "https://docs.rs/cargo-plugin-utils"
homepage = "https://github.com/legra-ai/cargo-plugin-utils"
rust-version = "1.93.0"
publish = true

include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
gix = { version = "0.90.0", default-features = false, features = ["revision", "sha1"] }
console = "0.16.4"
indicatif = "0.18.6"
carlog = "0.1"
portable-pty = "0.9.0"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "sync",
    "time",
] }

[build-dependencies]
rhusky = "2.0.1"

[dev-dependencies]
tempfile = "3.27"
